server:
  address: ":8080"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s
  rate_limit: 200
  rate_burst: 50

database:
  driver: sqlite
  dsn: ./data/plantguard.db
  migrations_dir: ./migrations/sqlite
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

worker:
  interval: 15s
  offline_after: 2m
  cleanup_before: 24h

logging:
  level: info
  format: json

notifications:
  webhook_url: ""
  webhook_timeout: 5s
